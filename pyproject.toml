[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vasquez"
version = "0.1.0"
description = "Motor de inyección de fallos de entorno y hardware (Fault Injection Engine) en C vía LD_PRELOAD"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/vasquez"
Repository = "https://github.com/INGCOM-UNRN-P1/vasquez.git"
Issues = "https://github.com/INGCOM-UNRN-P1/vasquez/issues"

[project.scripts]
vasquez = "vasquez.cli:app"

[project.entry-points."ripley.plugins"]
fault_injection = "vasquez.plugins.ripley_plugin:VasquezPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]